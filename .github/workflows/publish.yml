name: Build and deploy Data to GitHub Container Registry

on:
  push:
    branches:
      - main
    paths:
      - data/**
      - fuseki/**
      - transform/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v5
      
      - uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker build . -t ghcr.io/open-data-infrastructure/data:latest
          docker push ghcr.io/open-data-infrastructure/data:latest
